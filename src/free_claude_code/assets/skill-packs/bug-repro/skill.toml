name = "bug-repro"
version = "0.1.0"
purpose = "Reproduce a bug, isolate the root cause, prepare a minimal patch, a regression test and full validation"
platforms = ["linux", "macos", "windows"]
required_tools = ["git"]
max_risk = "r1"
approval_from = "r2"
timeout_seconds = 1800
rollback = "Work on a branch; the patch and regression test are reverted together by dropping the branch"
verification = ["Failing reproduction captured before the fix", "Regression test fails without the patch and passes with it", "Full test suite green after the change"]
executable = false

[[tools]]
name = "reproduce"
description = "Capture the exact failing behavior: command, inputs, expected vs actual output"
timeout_seconds = 600
max_output_bytes = 524288

[[tools]]
name = "isolate"
description = "Narrow the failure to the smallest input, call or module that still shows it"
timeout_seconds = 600
max_output_bytes = 262144
