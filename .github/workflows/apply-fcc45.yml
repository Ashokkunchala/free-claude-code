name: apply-fcc45
on:
  push:
    branches: [chore/apply-fcc45]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Restore raw blob bytes in worktree
        run: |
          git config core.autocrlf false
          git rm -r -q --cached .
          git reset -q --hard
      - name: Decode patch
        run: echo '' | base64 -d > /tmp/series.patch
      - name: Apply series
        run: |
          git config user.name "fcc-apply-bot"
          git config user.email "fcc-apply-bot@users.noreply.github.com"
          git am --keep-cr --whitespace=nowarn /tmp/series.patch
      - name: Push branch
        run: |
          git fetch origin feat/mcp-call || true
          git push --force-with-lease origin HEAD:feat/mcp-call
