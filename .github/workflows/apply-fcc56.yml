      - name: Apply series
        run: |
          git config user.name "fcc-apply-bot"
          git config user.email "fcc-apply-bot@users.noreply.github.com"
          git config core.autocrlf false
          git am --keep-cr --whitespace=nowarn /tmp/series.patch
      - name: Push branch
        run: |
          git fetch origin feat/env-context || true
          git push --force-with-lease origin HEAD:feat/env-context
