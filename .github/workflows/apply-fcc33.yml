name: apply-fcc33
on:
  push:
    branches: [chore/apply-fcc33]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: apply patch and push
        run: |
          set -e
          git config user.name "instinct[bot]"
          git config user.email "instinct[bot]@users.noreply.github.com"
          git config core.autocrlf false
          git rm -r --cached . -q
          git reset --hard -q
          echo "" | base64 -d > /tmp/p.patch
          git am /tmp/p.patch
          git fetch origin feat/t5-skill-permissions || true
          git push origin HEAD:feat/t5-skill-permissions --force-with-lease
