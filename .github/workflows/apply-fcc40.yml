name: apply-fcc40
on:
  push:
    branches: [chore/apply-fcc40]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/t6-budgets
          fetch-depth: 0
      - name: apply patch and push
        run: |
          set -e
          git config user.name "instinct[bot]"
          git config user.email "instinct[bot]@users.noreply.github.com"
          git config core.autocrlf false
          echo "" | base64 -d > /tmp/p.patch
          git am /tmp/p.patch
          git fetch origin feat/t6-budgets || true
          git push origin HEAD:feat/t6-budgets --force-with-lease
